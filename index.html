<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dobro dosli na nase vencanje</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #2f2a26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #8b6f5a;
      color: white;
      width: 100%;
      max-width: 260px;
    }

    button:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 24px;
    }

    .file-list {
      margin-top: 16px;
      text-align: left;
      font-size: 0.95rem;
    }

    .file-list ul {
      padding-left: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dobro dosli na nase vencanje</h1>

    <a href="frontend/upload_media.html" style="text-decoration: none;">
      <button type="button">Upload media</button>
    </a>
  </div>

  <script>
    const uploadButton = document.getElementById("uploadButton");
    const fileInput = document.getElementById("fileInput");
    const message = document.getElementById("message");
    const fileList = document.getElementById("fileList");

    uploadButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", async () => {
      const files = fileInput.files;

      if (!files || files.length === 0) {
        message.textContent = "Nijedan fajl nije izabran.";
        fileList.innerHTML = "";
        return;
      }

      const names = Array.from(files).map(file => `<li>${file.name}</li>`).join("");
      fileList.innerHTML = `
        <strong>Izabrani fajlovi:</strong>
        <ul>${names}</ul>
      `;

      message.textContent = "Slanje fajlova...";

      try {
        const formData = new FormData();

        for (const file of files) {
          formData.append("files", file);
        }

        formData.append("source", "wedding-page");

        const response = await fetch("https://example.com/upload", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Upload failed");
        }

        message.textContent = "Fajlovi su uspesno poslati.";
        fileInput.value = "";
      } catch (error) {
        console.error(error);
        message.textContent = "Doslo je do greske pri upload-u.";
      }
    });
  </script>
</body>
</html>
