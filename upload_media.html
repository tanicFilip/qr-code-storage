
<!DOCTYPE html>
<html lang="sr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Upload Media</title>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f8f5f2;
			color: #2f2a26;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 24px;
			box-sizing: border-box;
		}

		.container {
			text-align: center;
			max-width: 420px;
			width: 100%;
		}

		h1 {
			font-size: 2rem;
			line-height: 1.3;
			margin-bottom: 24px;
		}

		button {
			padding: 14px 28px;
			font-size: 1rem;
			border: none;
			border-radius: 10px;
			cursor: pointer;
			background: #8b6f5a;
			color: white;
			width: 100%;
			max-width: 260px;
		}

		button:hover {
			opacity: 0.92;
		}

		.message {
			margin-top: 16px;
			font-size: 0.95rem;
			min-height: 24px;
		}

		.file-list {
			margin-top: 16px;
			text-align: left;
			font-size: 0.95rem;
		}

		.file-list ul {
			padding-left: 18px;
		}

		.hidden {
			display: none;
		}
	</style>
</head>
<body>
	<div class="container">

		<h1>Otpremi medija</h1>
		<div id="userNameDisplay" style="margin-bottom: 12px; font-size: 1.1rem;"></div>

		<input
			id="fileInput"
			class="hidden"
			type="file"
			accept="image/*,video/*"
			multiple
		/>
		<input type="hidden" id="userIdHidden" />

		<button id="uploadButton" type="button">Otpremi medija</button>

		<div class="message" id="message"></div>

		<div class="file-list" id="fileList"></div>
		<div style="margin-top: 24px;">
			<a href="../index.html" style="text-decoration: none;">
				<button type="button" style="background: #aaa;">Nazad</button>
			</a>
		</div>
	</div>

		<script src="config.js"></script>
		<script>
			// Backend API base URL — loaded from config.js, fallback to localhost
			const API_BASE_URL = window.API_BASE_URL || 'http://localhost:3000';

			// Helper to get query param
			function getQueryParam(name) {
				const urlParams = new URLSearchParams(window.location.search);
				return urlParams.get(name) || '';
			}

			const uploadButton = document.getElementById("uploadButton");
			const fileInput = document.getElementById("fileInput");
			const message = document.getElementById("message");
			const fileList = document.getElementById("fileList");
			const userIdHidden = document.getElementById("userIdHidden");
			const userNameDisplay = document.getElementById("userNameDisplay");

			// Get user name from query param and display it
			const userId = getQueryParam('userid');
			if (userId) {
				userNameDisplay.textContent = `Korisnik: ${userId}`;
				userIdHidden.value = userId;
			}

			uploadButton.addEventListener("click", () => {
				fileInput.click();
			});

			fileInput.addEventListener("change", async () => {
				const files = fileInput.files;

				if (!files || files.length === 0) {
					message.textContent = "Nijedan fajl nije izabran.";
					fileList.innerHTML = "";
					return;
				}

				const names = Array.from(files).map(file => `<li>${file.name}</li>`).join("");
				fileList.innerHTML = `
					<strong>Izabrani fajlovi:</strong>
					<ul>${names}</ul>
				`;

				message.textContent = "Otpremanje fajlova...";

				try {
					const formData = new FormData();
					formData.append("source", "wedding-page");
					formData.append("userid", userId || "");
					for (const file of files) {
						formData.append("files", file, file.name);
					}

					const response = await fetch(`${API_BASE_URL}/upload`, {
						method: "POST",
						body: formData
					});

					if (!response.ok) {
						let errorDetail = '';
						try {
							errorDetail = await response.text();
						} catch (_) {}
						throw new Error(`${response.status} ${response.statusText}: ${errorDetail}`);
					}

					const result = await response.json();
					message.textContent = `Fajlovi su uspešno otpremljeni. GUID: ${result.guid}`;
					fileInput.value = "";
				} catch (error) {
					console.error("Upload error:", error);
					message.innerHTML = `<span style="color:red;">Došlo je do greške pri otpremanju.<br><small>${error.message || error}</small></span>`;
				}
			});
		</script>
</body>
</html>
