<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dobro dosli na nase vencanje</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #2f2a26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #8b6f5a;
      color: white;
      width: 100%;
      max-width: 260px;
    }

    button:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 24px;
    }

    .file-list {
      margin-top: 16px;
      text-align: left;
      font-size: 0.95rem;
    }

    .file-list ul {
      padding-left: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dobro došli na naše venčanje</h1>

    <div style="margin-bottom: 18px;">
      <label for="userName" style="font-size:1rem;">Vaše ime?</label><br />
      <input id="userName" type="text" style="margin-top:8px;padding:10px;width:90%;max-width:260px;border-radius:8px;border:1px solid #ccc;font-size:1rem;" placeholder="Unesite ime" />
    </div>
    <button id="goToUpload" type="button">Otpremi medija</button>
  </div>
  <script>
    document.getElementById('goToUpload').addEventListener('click', function() {
      const name = document.getElementById('userName').value.trim();
      const url = name ? `upload_media.html?userid=${encodeURIComponent(name)}` : 'upload_media.html';
      window.location.href = url;
    });
  </script>
</body>
</html>
